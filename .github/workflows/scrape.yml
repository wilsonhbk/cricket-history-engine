name: Cricket Data Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # Daily at 6:30 PM IST

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pandas pyarrow fastparquet lxml html5lib beautifulsoup4

      - name: Run Statsguru Harvester
        run: |
          python scraper.py

      - name: Commit and Save Database Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "Official Cricinfo harvest complete" && git push)
